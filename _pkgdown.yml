url: https://f-slg.github.io/fhirviews/
lang: es

template:
  bootstrap: 5
  bslib:
    primary: "#0F2233"
    link-color: "#9A6B00"
    base_font: {google: "Source Sans 3"}
    heading_font: {google: "Source Sans 3"}
    code_font: {google: "JetBrains Mono"}

home:
  title: "fhirviews: FHIR desde R y vistas tabulares con SQL on FHIR"
  description: >
    Cliente HL7 FHIR R4 para R y RStudio y motor de ViewDefinition (SQL on
    FHIR) que convierte recursos FHIR en data.frames.
  sidebar:
    structure: [links, license, citation, authors, dev]
  links:
  - text: Especificación SQL on FHIR
    href: https://sql-on-fhir.org/
  - text: HL7 FHIR R4
    href: https://hl7.org/fhir/R4/
  - text: Taller aprende-fhir
    href: https://github.com/f-slg/aprende-fhir

navbar:
  bg: primary
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    reference:
      text: Funciones
      href: reference/index.html
    articles:
      text: Artículos
      menu:
      - text: Primeros pasos
        href: articles/fhirviews.html
      - text: ViewDefinition en detalle
        href: articles/vistas.html
      - text: Tasas por cantón con FHIR y pobecu
        href: articles/tasas-pobecu.html
      - text: Servidores reales y grandes volúmenes
        href: articles/servidores-y-volumen.html
      - text: -------
      - text: Cómo funciona por dentro
        href: articles/arquitectura.html
    news:
      text: Novedades
      href: news/index.html

reference:
- title: Cliente FHIR
  desc: Conectarse a un servidor FHIR R4 y hacer peticiones, como en Postman.
  contents:
  - fhir_conectar
  - fhir_buscar
  - fhir_leer
  - fhir_everything
  - fhir_exportar
  - fhir_crear
  - fhir_validar
  - fhir_capacidades
  - fhir_peticion
  - fhir_ejecutar_texto
  - fhir_vista
  - fhir_disponible
- title: Autenticación SMART on FHIR
  desc: >
    OAuth2 para servidores protegidos: client credentials, SMART Backend
    Services (JWT firmado) e inicio de sesión en el navegador con PKCE.
  contents:
  - fhir_auth
  - fhir_smart_configuracion
- title: RStudio
  desc: Panel Connections, conexión activa y addins.
  contents:
  - fhir_conexion_activa
  - addin_peticion
- title: Recursos FHIR
  contents:
  - fhir_recursos
  - fhir_tabla
- title: Vistas SQL on FHIR
  desc: Convertir recursos FHIR en tablas con un ViewDefinition.
  contents:
  - vista_ejecutar
  - vista_crear
  - vista_leer
  - vista_validar
  - vista_json
  - vista_duckdb
- title: Motor DuckDB (experimental)
  desc: Traducir vistas a SQL y ejecutarlas sobre NDJSON o Parquet sin cargar
    los recursos en R.
  contents:
  - vista_ejecutar_duckdb
  - vista_sql
- title: Conformidad
  contents:
  - vista_conformidad
- title: FHIRPath
  contents:
  - vista_fhirpath
  - fhirviews_motor
- title: Paquete
  contents:
  - fhirviews-package
