[package]
name = "fhirviews-rust-validator"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false
license = "MIT"
description = "Optional structural validator for resources constructed and typed by fhirviews R"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["arbitrary_precision", "preserve_order", "raw_value"] }
indexmap = "=2.2.6"
regex = "=1.12.2"

[profile.release]
codegen-units = 1
lto = "thin"
