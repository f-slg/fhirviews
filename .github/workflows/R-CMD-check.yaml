# Verifica el paquete en Windows, macOS y Linux en cada push y pull request.
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          - {os: macos-latest,   r: 'release'}
          - {os: ubuntu-latest,  r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      # pobecu (Suggests, viñeta de tasas) aún no está en CRAN: se instalan
      # las dependencias obligatorias y los Suggests se listan aquí, con
      # pobecu desde GitHub. Cuando esté en CRAN, basta con volver a la
      # configuración por defecto.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::pkgload
            any::knitr
            any::rmarkdown
            any::DBI
            any::duckdb
            any::rstudioapi
            any::jose
            any::openssl
            any::httpuv
            any::dplyr
            any::dbplyr
            github::f-slg/pobecu
          needs: check

      - name: Verificar motor DuckDB sin omitir pruebas SQL
        shell: Rscript {0}
        run: |
          pkgload::load_all()
          con <- fhirviews:::conectar_duckdb()
          fhirviews:::cargar_json_duckdb(con)
          stopifnot(DBI::dbGetQuery(con, "SELECT json_valid('{}') AS ok")$ok)
          DBI::dbDisconnect(con)

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
