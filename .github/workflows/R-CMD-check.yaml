# Verifica el paquete en Windows, macOS y Linux en cada push y pull request.
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check

permissions:
  contents: read

concurrency:
  group: r-cmd-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release'}
          # Intel evita la cola arm64; no sustituye una prueba de Apple Silicon.
          - {os: macos-15-intel, r: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'devel'}
          - {os: ubuntu-22.04,   r: '4.1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_FORCE_SUGGESTS_: ${{ matrix.config.r != 'release' && 'false' || 'true' }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      # Todas las dependencias (también los Suggests) están en CRAN. pobecu
      # solo lo usa el artículo de tasas, que se construye en pkgdown.yaml.
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: matrix.config.r == 'release'
        with:
          extra-packages: |
            any::rcmdcheck
            any::pkgload
          needs: check

      # DuckDB actual requiere R >= 4.2 y compilarlo en R-devel es costoso.
      # R mínimo y R-devel verifican cliente/V8; los tres sistemas con
      # R release verifican también DuckDB y sus pruebas SQL.
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: matrix.config.r != 'release'
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::rcmdcheck
            any::pkgload
            any::DBI
            any::dbplyr
            any::dplyr
            any::httpuv
            any::jose
            any::knitr
            any::openssl
            any::rmarkdown
            any::rstudioapi
            any::testthat
          needs: check

      - name: Verificar motor DuckDB sin omitir pruebas SQL
        if: matrix.config.r == 'release'
        shell: Rscript {0}
        run: |
          pkgload::load_all()
          con <- fhirviews:::conectar_duckdb()
          fhirviews:::cargar_json_duckdb(con)
          stopifnot(DBI::dbGetQuery(con, "SELECT json_valid('{}') AS ok")$ok)
          DBI::dbDisconnect(con)

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'

      - name: Aceptar el archivo fuente construido en una instalacion independiente
        shell: Rscript {0}
        run: |
          candidatos <- list.files("check", pattern = "^fhirviews_.*\\.tar\\.gz$",
                                    recursive = TRUE, full.names = TRUE)
          stopifnot(length(candidatos) == 1L)
          perfil <- if (Sys.getenv("PILOTO_R") == "release") "completo" else "basico"
          salida <- file.path(Sys.getenv("RUNNER_TEMP"), "aceptacion-candidato")
          estado <- system2(file.path(R.home("bin"), "Rscript"),
            c("--vanilla", "data-raw/probar-candidato.R", shQuote(candidatos),
              shQuote(salida), perfil))
          stopifnot(estado == 0L)
        env:
          PILOTO_R: ${{ matrix.config.r }}

      - name: Conservar informes de aceptacion del candidato
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: piloto-${{ runner.os }}-${{ matrix.config.r }}
          path: |
            ${{ runner.temp }}/aceptacion-candidato/
            !${{ runner.temp }}/aceptacion-candidato/biblioteca/**
          if-no-files-found: ignore
          retention-days: 14
