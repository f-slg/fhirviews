# Laboratorio fuera del paquete R. No instala Rust al instalar fhirviews.
name: Experimento Rust

on:
  pull_request:
    paths:
      - '.github/workflows/rust-experimento.yaml'
      - 'data-raw/experimento-rust/**'
      - 'R/**'
      - 'inst/**'
      - 'DESCRIPTION'
  push:
    branches: [main]
    paths:
      - '.github/workflows/rust-experimento.yaml'
      - 'data-raw/experimento-rust/**'
      - 'R/**'
      - 'inst/**'
      - 'DESCRIPTION'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-experimento-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paridad:
    name: rust-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26-intel]
    env:
      R_KEEP_PKG_SOURCE: yes
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
      - name: Instalar el paquete R con bytecode
        run: R CMD INSTALL --no-multiarch .
      - name: Preparar el compilador del laboratorio
        run: rustup toolchain install 1.75.0 --profile minimal --no-self-update
      - name: Compilar el nucleo con dependencias fijadas
        run: cargo +1.75.0 build --release --locked --jobs 2 --manifest-path data-raw/experimento-rust/Cargo.toml
      - name: Probar el nucleo Rust
        run: cargo +1.75.0 test --locked --jobs 2 --manifest-path data-raw/experimento-rust/Cargo.toml
      - name: Comparar los tres constructores y sus referencias
        shell: Rscript {0}
        run: |
          binario <- file.path("data-raw", "experimento-rust", "target", "release",
            paste0("fhirviews-validator-experiment", if (.Platform$OS.type == "windows") ".exe" else ""))
          for (script in c("comprobar", "aristas")) {
            salida <- file.path(Sys.getenv("RUNNER_TEMP"), paste0("rust-", script))
            estado <- system2(file.path(R.home("bin"), "Rscript"), c("--vanilla",
              file.path("data-raw", "experimento-rust", paste0(script, ".R")),
              shQuote(normalizePath(binario)), shQuote(salida)))
            stopifnot(estado == 0L)
          }
      - name: Conservar resultados de paridad
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-paridad-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/rust-comprobar/paridad.json
            ${{ runner.temp }}/rust-aristas/aristas.json
          if-no-files-found: ignore
          retention-days: 14
