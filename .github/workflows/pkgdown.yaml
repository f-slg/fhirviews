# Construye el sitio pkgdown y lo publica en GitHub Pages (rama gh-pages).
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # pobecu (Suggests) aún no está en CRAN: se instala desde GitHub.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::pkgdown
            any::knitr
            any::rmarkdown
            any::DBI
            any::duckdb
            any::rstudioapi
            github::f-slg/pobecu
            local::.
          needs: website

      - name: Construir el sitio
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # Informe de conformidad de SQL on FHIR en el formato oficial, para la
      # página de implementaciones (https://sql-on-fhir.org/extra/impls.html).
      # GitHub Pages lo sirve con CORS abierto.
      - name: Informe de conformidad de SQL on FHIR
        run: |
          fhirviews::vista_conformidad(informe = "docs/sof-test-results.json")
        shell: Rscript {0}

      - name: Publicar en GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
