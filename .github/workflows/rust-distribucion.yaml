name: Distribucion Rust

on:
  pull_request:
    paths:
      - '.github/workflows/rust-distribucion.yaml'
      - '.github/workflows/pkgdown.yaml'
      - 'data-raw/distribucion-rust/**'
      - 'componentes/rust/**'
      - 'R/**'
      - 'inst/**'
      - 'tests/**'
      - 'DESCRIPTION'
  push:
    branches: [main]
    paths:
      - '.github/workflows/rust-distribucion.yaml'
      - '.github/workflows/pkgdown.yaml'
      - 'data-raw/distribucion-rust/**'
      - 'componentes/rust/**'
      - 'R/**'
      - 'inst/**'
      - 'tests/**'
      - 'DESCRIPTION'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-distribucion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construir:
    name: paquete-${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            flags: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            flags: '-C target-feature=+crt-static'
          - os: macos-15-intel
            target: x86_64-apple-darwin
            flags: ''
          - os: macos-15
            target: aarch64-apple-darwin
            flags: ''
    env:
      RUSTFLAGS: ${{ matrix.flags }}
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v6
      - name: Preparar toolchain fijado
        run: rustup toolchain install 1.75.0 --profile minimal --no-self-update --target ${{ matrix.target }}
      - name: Compilar y probar el componente nativo
        shell: bash
        run: |
          cargo +1.75.0 build --release --locked --jobs 2 --target ${{ matrix.target }} --manifest-path componentes/rust/Cargo.toml
          cargo +1.75.0 test --locked --jobs 2 --target ${{ matrix.target }} --manifest-path componentes/rust/Cargo.toml
          cargo +1.75.0 metadata --locked --format-version 1 --manifest-path componentes/rust/Cargo.toml > "$RUNNER_TEMP/cargo-metadata.json"
          rustup run 1.75.0 rustc --print sysroot > "$RUNNER_TEMP/rust-root.txt"
      - name: Probar empaquetador y preparar ZIP con licencias
        shell: bash
        run: |
          python3 data-raw/distribucion-rust/test_paquetes.py
          python3 data-raw/distribucion-rust/test_publicar.py
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          temporal = Path(os.environ['RUNNER_TEMP'])
          target = '${{ matrix.target }}'
          exe = 'fhirviews-rust-validator' + ('.exe' if target.endswith('msvc') else '')
          subprocess.run(['python3', 'data-raw/distribucion-rust/paquetes.py', 'crear',
              '--binario', str(Path('componentes/rust/target')/target/'release'/exe),
              '--target', target, '--metadata', str(temporal/'cargo-metadata.json'),
              '--rust-root', (temporal/'rust-root.txt').read_text().strip(),
              '--salida', str(temporal/'paquete'), '--commit', os.environ['GITHUB_SHA'],
              '--runner', '${{ matrix.os }}', '--flags='+os.environ.get('RUSTFLAGS','')], check=True)
          PY
      - name: Preparar bloqueador ejecutable para el consumidor Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          rustc +1.75.0 --edition 2021 --target x86_64-pc-windows-msvc -C target-feature=+crt-static --crate-name bloqueo_compiladores data-raw/distribucion-rust/bloqueo-compiladores.rs -o "$RUNNER_TEMP/paquete/bloqueo-compiladores.exe"
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          exe=Path(os.environ['RUNNER_TEMP'])/'paquete/bloqueo-compiladores.exe'
          Path(str(exe)+'.sha256').write_bytes((hashlib.sha256(exe.read_bytes()).hexdigest()+'  '+exe.name+'\n').encode())
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: binario-${{ matrix.target }}
          path: ${{ runner.temp }}/paquete/*
          if-no-files-found: error
          retention-days: 30

  consumir:
    name: consumidor-${{ matrix.target }}
    needs: construir
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: binario-${{ matrix.target }}
          path: ${{ runner.temp }}/descarga
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::testthat
            any::DBI
            any::duckdb
            any::RSQLite
      - name: Verificar ZIP y preparar entorno sin compilador
        shell: bash
        run: |
          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          spec=importlib.util.spec_from_file_location('paquetes', 'data-raw/distribucion-rust/paquetes.py')
          p=importlib.util.module_from_spec(spec); spec.loader.exec_module(p)
          t=Path(os.environ['RUNNER_TEMP']); descarga=t/'descarga'
          archivos=list(descarga.glob('*.zip')); assert len(archivos)==1
          z=archivos[0]; sha=(descarga/(z.name+'.sha256')).read_text().split()[0]
          m=p.verificar(z, sha, t/'extraido con espacios')
          exe=t/'extraido con espacios'/m['directorio']/m['ejecutable']
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('FHIRVIEWS_RUST_BIN='+str(exe.resolve())+'\n')
              f.write('FHIRVIEWS_COMPILER_MARKER='+str(t/'compilador-invocado.txt')+'\n')
          PY
          python3 data-raw/distribucion-rust/sin-compilador.py "$RUNNER_TEMP/sin-compilador" --windows-stub "$RUNNER_TEMP/descarga/bloqueo-compiladores.exe" >> "$GITHUB_PATH"
      - name: Instalar R con pruebas incluidas y sin invocar Rust
        shell: Rscript {0}
        run: |
          bloqueados <- normalizePath(unname(Sys.which(c("cargo", "rustc", "rustup"))),
            winslash = "/", mustWork = TRUE)
          esperado <- normalizePath(file.path(Sys.getenv("RUNNER_TEMP"), "sin-compilador"),
            winslash = "/", mustWork = TRUE)
          print(bloqueados)
          stopifnot(all(dirname(bloqueados) == esperado))
          exe <- file.path(R.home("bin"), if (.Platform$OS.type == "windows") "R.exe" else "R")
          stopifnot(system2(exe, c("CMD", "INSTALL", "--install-tests", "--no-multiarch", ".")) == 0L)
          stopifnot(!file.exists(Sys.getenv("FHIRVIEWS_COMPILER_MARKER")))
      - name: Probar los siete recursos con el paquete instalado
        shell: Rscript {0}
        run: |
          salida <- file.path(Sys.getenv("RUNNER_TEMP"), "consumidor")
          rscript <- file.path(R.home("bin"), "Rscript")
          stopifnot(system2(rscript, c("--vanilla", "data-raw/distribucion-rust/probar-instalado.R",
            shQuote(Sys.getenv("FHIRVIEWS_RUST_BIN")), shQuote(salida))) == 0L)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: consumidor-${{ matrix.target }}
          path: ${{ runner.temp }}/consumidor/consumidor.json
          if-no-files-found: error
          retention-days: 30

  publicar:
    name: publicar-binarios
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [construir, consumir]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: fhirviews-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/artefactos
      - name: Preparar catalogo y paquetes verificados
        shell: bash
        run: python3 data-raw/distribucion-rust/publicar.py --artefactos "$RUNNER_TEMP/artefactos" --salida "$RUNNER_TEMP/publicar" --commit "$GITHUB_SHA"
      - name: Publicar archivos estaticos sin crear una release R
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: ${{ runner.temp }}/publicar
          commit-message: 'Publish verified Rust component bundles from ${{ github.sha }}'
